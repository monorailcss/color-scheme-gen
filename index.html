<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<base href="./" />
<title>MonorailCSS Palette Playground</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <div class="app-header-text">
    <h1>MonorailCSS Palette Playground</h1>
    <p class="sub">Generate a Tailwind-style 11-step OKLCH palette from a seed color.</p>
  </div>
  <a class="repo-link" href="https://github.com/monorailcss/color-scheme-gen" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    <span>GitHub</span>
  </a>
</header>

<main class="layout">
  <aside class="controls">
    <div class="field">
      <label for="name">Color name</label>
      <input id="name" type="text" value="" placeholder="brand" />
    </div>

    <div class="field">
      <label>Seed color</label>
      <div class="seed-row">
        <input id="seed-color" type="color" value="#7e3e3e" />
        <input id="seed-hex" type="text" value="#7e3e3e" spellcheck="false" />
      </div>
      <div id="seed-oklch" class="readout">oklch(…)</div>
    </div>

    <div class="field">
      <label>Palette kind</label>
      <div class="seg" role="tablist">
        <button type="button" data-kind="foreground" class="on">Foreground</button>
        <button type="button" data-kind="neutral">Neutral</button>
      </div>
    </div>

    <div class="field">
      <label for="chroma-scale">Chroma scale <span id="chroma-scale-val" class="val">1.00</span></label>
      <input id="chroma-scale" type="range" min="0" max="2" step="0.05" value="1" />
    </div>

    <div class="field">
      <label for="hue-shift">Hue shift (50→950) <span id="hue-shift-val" class="val">0°</span></label>
      <input id="hue-shift" type="range" min="-30" max="30" step="1" value="0" />
    </div>

    <div class="field checkbox">
      <input id="high-contrast" type="checkbox" />
      <label for="high-contrast">High-contrast lightness curve</label>
    </div>

    <div class="field" id="dark-chroma-field" hidden>
      <label for="dark-chroma">Dark-side chroma retention <span id="dark-chroma-val" class="val">0.50</span></label>
      <input id="dark-chroma" type="range" min="0" max="1" step="0.05" value="0.5" />
    </div>

    <div class="field">
      <label for="anchor">Anchor step</label>
      <select id="anchor">
        <option>50</option><option>100</option><option>200</option><option>300</option>
        <option>400</option><option selected>500</option><option>600</option>
        <option>700</option><option>800</option><option>900</option><option>950</option>
      </select>
    </div>

    <div class="field">
      <label for="compare">Compare to Tailwind</label>
      <select id="compare">
        <option value="">— none —</option>
      </select>
      <button id="load-compare" type="button" class="btn-secondary">Load into controls</button>
    </div>

    <div class="field">
      <button id="copy-link" type="button" class="btn-secondary">Copy shareable link</button>
    </div>
  </aside>

  <section class="output">
    <div class="tabs">
      <button type="button" data-tab="swatches" class="on">Swatches</button>
      <button type="button" data-tab="csharp">C# code</button>
      <button type="button" data-tab="tailwind">Tailwind</button>
      <button type="button" data-tab="demo">Demo</button>
    </div>

    <div class="tab-panel" data-panel="swatches">
      <div id="swatches" class="swatches"></div>
      <div id="swatches-compare" class="swatches compare"></div>
    </div>

    <div class="tab-panel" data-panel="csharp" hidden>
      <div class="code-actions">
        <button type="button" id="copy-csharp" class="btn-secondary">Copy</button>
      </div>
      <pre id="csharp" class="code"></pre>
    </div>

    <div class="tab-panel" data-panel="tailwind" hidden>
      <div class="code-actions">
        <button type="button" id="copy-tailwind" class="btn-secondary">Copy</button>
      </div>
      <pre id="tailwind" class="code"></pre>
    </div>

    <div class="tab-panel" data-panel="demo" hidden>
      <div class="demo-grid">
        <div id="demo-light" class="demo-card light"></div>
        <div id="demo-dark" class="demo-card dark"></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>

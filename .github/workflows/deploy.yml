name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build color-name data
        run: node scripts/build-paint-data.mjs

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js color.js palette.js tailwind-palettes.js color-names.js _site/

      - name: Rewrite base href for Pages subpath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE="/${REPO_NAME}/"
          echo "Setting <base href=\"${BASE}\">"
          sed -i "s|<base href=\"[^\"]*\" />|<base href=\"${BASE}\" />|" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
